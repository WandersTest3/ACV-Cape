plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

def remapGroups = ['g1', 'g2', 'g3', 'g4', 'g5', 'g6']
def plainGroups = ['g7', 'g8', 'g9']

allprojects {
    group = 'max.panda'
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

configure(remapGroups.collect { project(":$it") }) {
    apply plugin: 'net.fabricmc.fabric-loom-remap'

    dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        compileOnly rootProject.sourceSets.main.output
    }

    sourceSets {
        stubs {
            compileClasspath += configurations.compileClasspath
        }
        main {
            compileClasspath += stubs.output
        }
    }

    loom {
        mixin {
            useLegacyMixinAp = false
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = 'UTF-8'
    }
}

sourceSets {
    stubs
}

configure(plainGroups.collect { project(":$it") }) {
    apply plugin: 'java'

    def cacheDir = new File(rootProject.projectDir, ".mccache/${project.minecraft_version}")
    def libsFile = new File(projectDir, 'libs.txt')

    def downloadMc = tasks.register('downloadMc') {
        inputs.file libsFile
        outputs.dir cacheDir
        doLast {
            cacheDir.mkdirs()
            libsFile.readLines().findAll { it.trim() }.each { url ->
                def name = url.tokenize('/').last()
                def target = new File(cacheDir, name)
                if (!target.exists()) {
                    def tmp = new File(cacheDir, name + '.part')
                    tmp.withOutputStream { out -> new URI(url).toURL().withInputStream { out << it } }
                    tmp.renameTo(target)
                }
            }
        }
    }

    dependencies {
        compileOnly files(fileTree(cacheDir) { include '*.jar' }.builtBy(downloadMc))
        compileOnly "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        compileOnly 'io.github.llamalad7:mixinextras-fabric:0.5.4'
        compileOnly 'net.fabricmc:sponge-mixin:0.17.0+mixin.0.8.7'
        compileOnly rootProject.sourceSets.main.output
    }

    sourceSets {
        stubs {
            compileClasspath += configurations.compileClasspath
        }
        main {
            compileClasspath += stubs.output
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
        if (name == 'compileJava') {
            doLast {
                destinationDirectory.get().asFileTree.matching { include '**/*.class' }.each { f ->
                    def bytes = f.bytes
                    if ((bytes[6] & 0xFF) == 0 && (bytes[7] & 0xFF) > 65) {
                        bytes[7] = (byte)65
                        f.bytes = bytes
                    }
                }
            }
        }
    }
}

configurations {
    bundled {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    compileOnly "net.fabricmc:fabric-loader:${loader_version}"
    compileOnly 'net.fabricmc:sponge-mixin:0.17.0+mixin.0.8.7'
    compileOnly 'org.ow2.asm:asm-tree:9.8'
    compileOnly 'org.slf4j:slf4j-api:2.0.16'
    compileOnly sourceSets.stubs.output
    bundled 'io.github.llamalad7:mixinextras-fabric:0.5.4'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    archiveClassifier = 'core'
}

def registerPack = { String taskName, String suffix, String dir, List remapList, List plainList ->
    tasks.register(taskName, Jar) {
        group = 'build'
        archiveBaseName = rootProject.archives_name
        archiveVersion = "V${project.version}-${suffix}"
        destinationDirectory = layout.buildDirectory.dir('merged')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        def others = (remapGroups + plainGroups) - (remapList + plainList)
        from(sourceSets.main.output) {
            exclude 'fabric.mod.json'
            others.each { exclude "acvcape.${it}.mixins.json" }
        }
        from("packs/${dir}") {
            include 'fabric.mod.json'
            filter { it.replace('${version}', project.version.toString()) }
        }
        remapList.each { name ->
            def remapJar = project(":$name").tasks.named('remapJar')
            dependsOn remapJar
            from({ zipTree(remapJar.get().archiveFile) }) {
                include 'max/panda/capechanger/**'
            }
        }
        plainList.each { name ->
            def sub = project(":$name")
            dependsOn sub.tasks.named('classes')
            from(sub.sourceSets.main.output) {
                include 'max/panda/capechanger/**'
            }
        }
        from(configurations.bundled) {
            into 'META-INF/jars'
        }
    }
}

registerPack('mergedJar121', '1.21.x', '121', remapGroups, [])
registerPack('mergedJar26', '26.x', '26', [], plainGroups)

tasks.register('mergedJar') {
    group = 'build'
    dependsOn 'mergedJar121', 'mergedJar26'
}

assemble.dependsOn mergedJar
